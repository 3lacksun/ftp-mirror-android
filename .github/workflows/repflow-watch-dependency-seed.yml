name: RepFlow Watch Dependency Seeder

on:
  push:
    branches:
      - repflow-watch-dependency-seed-20260916g
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout public scratch repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          test -f "${ANDROID_HOME}/platforms/android-36/android.jar"

      - name: Resolve exact Capacitor 8.5.0 npm closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repflow-npm-seed"
          cd "$RUNNER_TEMP/repflow-npm-seed"
          cat > package.json <<'JSON'
          {
            "name": "repflow-public-dependency-seed",
            "private": true,
            "dependencies": {
              "@capacitor/android": "8.5.0",
              "@capacitor/core": "8.5.0"
            },
            "devDependencies": {
              "@capacitor/cli": "8.5.0"
            }
          }
          JSON
          npm install --no-audit --no-fund
          npm ls --all > npm-tree.txt
          tar -czf "$RUNNER_TEMP/repflow-capacitor-node-modules.tgz" node_modules package.json package-lock.json npm-tree.txt
          sha256sum "$RUNNER_TEMP/repflow-capacitor-node-modules.tgz" | tee "$RUNNER_TEMP/repflow-capacitor-node-modules.tgz.sha256"

      - name: Resolve exact RepFlow Android dependency graph in Android plugin context
        shell: bash
        run: |
          set -euo pipefail
          SEED="$RUNNER_TEMP/repflow-gradle-seed"
          mkdir -p "$SEED/phone/src/main" "$SEED/wear/src/main"
          cd "$SEED"
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > gradle.properties

          cat > settings.gradle <<'GRADLE'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = 'repflow-public-dependency-seed'
          include ':phone', ':wear'
          GRADLE

          cat > build.gradle <<'GRADLE'
          buildscript {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.13.0'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.21'
              classpath 'org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.3.21'
              classpath 'com.google.gms:google-services:4.4.4'
            }
          }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLE

          cat > phone/build.gradle <<'GRADLE'
          apply plugin: 'com.android.application'
          android {
            namespace 'net.nexarenew.depseed.phone'
            compileSdk 36
            defaultConfig { applicationId 'net.nexarenew.depseed.phone'; minSdk 24; targetSdk 36; versionCode 1; versionName '1' }
          }
          dependencies {
            implementation 'com.google.android.gms:play-services-wearable:20.0.1'
            implementation 'androidx.activity:activity:1.11.0'
            implementation 'androidx.appcompat:appcompat:1.7.1'
            implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
            implementation 'androidx.core:core:1.17.0'
            implementation 'androidx.core:core-splashscreen:1.2.0'
            implementation 'androidx.fragment:fragment:1.8.9'
            implementation 'androidx.webkit:webkit:1.14.0'
            implementation 'org.apache.cordova:framework:14.0.1'
            testImplementation 'junit:junit:4.13.2'
            androidTestImplementation 'androidx.test.ext:junit:1.3.0'
            androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
          }
          GRADLE

          cat > wear/build.gradle <<'GRADLE'
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          apply plugin: 'org.jetbrains.kotlin.kapt'
          apply plugin: 'org.jetbrains.kotlin.plugin.compose'
          android {
            namespace 'net.nexarenew.depseed.wear'
            compileSdk 36
            defaultConfig { applicationId 'net.nexarenew.depseed.wear'; minSdk 30; targetSdk 36; versionCode 1; versionName '1' }
            buildFeatures { compose true }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
            implementation 'com.google.android.gms:play-services-wearable:20.0.1'
            implementation 'androidx.activity:activity-compose:1.13.0'
            implementation 'androidx.wear.compose:compose-foundation:1.6.2'
            implementation 'androidx.wear.compose:compose-material:1.6.2'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
            implementation 'androidx.core:core-ktx:1.17.0'
            implementation 'androidx.wear:wear-ongoing:1.1.0'
            implementation 'androidx.health:health-services-client:1.1.0-rc02'
            implementation 'androidx.room:room-runtime:2.8.5'
            implementation 'androidx.room:room-ktx:2.8.5'
            kapt 'androidx.room:room-compiler:2.8.5'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'
          }
          GRADLE

          cat > phone/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@style/AppTheme"/></manifest>
          XML
          mkdir -p phone/src/main/res/values
          cat > phone/src/main/res/values/styles.xml <<'XML'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/></resources>
          XML

          cat > wear/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-feature android:name="android.hardware.type.watch"/><application android:theme="@android:style/Theme.DeviceDefault"/></manifest>
          XML

          gradle --no-daemon --stacktrace :phone:assembleDebug :wear:assembleDebug | tee "$RUNNER_TEMP/repflow-gradle-seed-build.txt"
          test -f phone/build/outputs/apk/debug/phone-debug.apk
          test -f wear/build/outputs/apk/debug/wear-debug.apk

      - name: Package dependency-only caches
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/repflow-cache-bundle"
          mkdir -p "$OUT"
          cp "$RUNNER_TEMP/repflow-gradle-seed-build.txt" "$OUT/"
          cp "$RUNNER_TEMP/repflow-capacitor-node-modules.tgz" "$OUT/"
          cp "$RUNNER_TEMP/repflow-capacitor-node-modules.tgz.sha256" "$OUT/"
          tar -C "$HOME/.gradle/caches" -czf "$OUT/gradle-modules2.tgz" modules-2
          sha256sum "$OUT/gradle-modules2.tgz" | tee "$OUT/gradle-modules2.tgz.sha256"
          find "$OUT" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort | tee "$OUT/CONTENTS.txt"

      - name: Upload dependency-only cache bundle
        uses: actions/upload-artifact@v4
        with:
          name: repflow-watch-public-dependency-cache
          path: ${{ runner.temp }}/repflow-cache-bundle/
          if-no-files-found: error
          retention-days: 7
