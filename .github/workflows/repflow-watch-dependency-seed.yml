name: RepFlow Watch Dependency Seeder

on:
  push:
    branches:
      - repflow-watch-dependency-seed-20260916g
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout public scratch repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Resolve exact Capacitor 8.5.0 npm closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repflow-npm-seed"
          cd "$RUNNER_TEMP/repflow-npm-seed"
          cat > package.json <<'JSON'
          {
            "name": "repflow-public-dependency-seed",
            "private": true,
            "dependencies": {
              "@capacitor/android": "8.5.0",
              "@capacitor/core": "8.5.0"
            },
            "devDependencies": {
              "@capacitor/cli": "8.5.0"
            }
          }
          JSON
          npm install --no-audit --no-fund
          npm ls --all > npm-tree.txt
          tar -czf "$RUNNER_TEMP/repflow-capacitor-node-modules.tgz" node_modules package.json package-lock.json npm-tree.txt
          sha256sum "$RUNNER_TEMP/repflow-capacitor-node-modules.tgz" | tee "$RUNNER_TEMP/repflow-capacitor-node-modules.tgz.sha256"

      - name: Resolve exact RepFlow Android public Maven closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repflow-gradle-seed"
          cd "$RUNNER_TEMP/repflow-gradle-seed"
          cat > settings.gradle <<'GRADLE'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          rootProject.name = 'repflow-public-dependency-seed'
          GRADLE
          cat > build.gradle <<'GRADLE'
          plugins { id 'base' }

          repositories {
            google()
            mavenCentral()
            gradlePluginPortal()
          }

          configurations {
            buildTools
            phoneRuntime
            wearRuntime
            androidTests
            capacitorRuntime
          }

          dependencies {
            buildTools 'com.android.tools.build:gradle:8.13.0'
            buildTools 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.21'
            buildTools 'org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.3.21'
            buildTools 'com.google.gms:google-services:4.4.4'

            phoneRuntime 'com.google.android.gms:play-services-wearable:20.0.1'
            phoneRuntime 'androidx.appcompat:appcompat:1.7.1'
            phoneRuntime 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
            phoneRuntime 'androidx.core:core-splashscreen:1.2.0'
            phoneRuntime 'junit:junit:4.13.2'

            androidTests 'androidx.test.ext:junit:1.3.0'
            androidTests 'androidx.test.espresso:espresso-core:3.7.0'

            capacitorRuntime 'androidx.activity:activity:1.11.0'
            capacitorRuntime 'androidx.appcompat:appcompat:1.7.1'
            capacitorRuntime 'androidx.core:core:1.17.0'
            capacitorRuntime 'androidx.fragment:fragment:1.8.9'
            capacitorRuntime 'androidx.webkit:webkit:1.14.0'
            capacitorRuntime 'org.apache.cordova:framework:14.0.1'

            wearRuntime 'com.google.android.gms:play-services-wearable:20.0.1'
            wearRuntime 'androidx.activity:activity-compose:1.13.0'
            wearRuntime 'androidx.wear.compose:compose-foundation:1.6.2'
            wearRuntime 'androidx.wear.compose:compose-material:1.6.2'
            wearRuntime 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
            wearRuntime 'androidx.core:core-ktx:1.17.0'
            wearRuntime 'androidx.wear:wear-ongoing:1.1.0'
            wearRuntime 'androidx.health:health-services-client:1.1.0-rc02'
            wearRuntime 'androidx.room:room-runtime:2.8.5'
            wearRuntime 'androidx.room:room-ktx:2.8.5'
            wearRuntime 'androidx.room:room-compiler:2.8.5'
            wearRuntime 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
            wearRuntime 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'
          }

          tasks.register('seedDeps') {
            doLast {
              configurations.findAll { it.canBeResolved }.each { cfg ->
                println("=== RESOLVING ${cfg.name} ===")
                cfg.resolvedConfiguration.lenientConfiguration.artifacts.each { a ->
                  println("${a.moduleVersion.id} -> ${a.file.name}")
                }
                def failures = cfg.resolvedConfiguration.lenientConfiguration.unresolvedModuleDependencies
                if (!failures.empty) {
                  failures.each { println("UNRESOLVED ${it.selector}: ${it.problem}") }
                  throw new GradleException("Unresolved dependencies in ${cfg.name}")
                }
              }
            }
          }
          GRADLE
          gradle --no-daemon --stacktrace seedDeps | tee "$RUNNER_TEMP/repflow-gradle-resolution.txt"

      - name: Package dependency caches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repflow-cache-bundle"
          cp "$RUNNER_TEMP/repflow-gradle-resolution.txt" "$RUNNER_TEMP/repflow-cache-bundle/"
          cp "$RUNNER_TEMP/repflow-capacitor-node-modules.tgz" "$RUNNER_TEMP/repflow-cache-bundle/"
          cp "$RUNNER_TEMP/repflow-capacitor-node-modules.tgz.sha256" "$RUNNER_TEMP/repflow-cache-bundle/"
          tar -C "$HOME/.gradle" -czf "$RUNNER_TEMP/repflow-cache-bundle/gradle-cache.tgz" caches
          sha256sum "$RUNNER_TEMP/repflow-cache-bundle/gradle-cache.tgz" | tee "$RUNNER_TEMP/repflow-cache-bundle/gradle-cache.tgz.sha256"
          find "$RUNNER_TEMP/repflow-cache-bundle" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort | tee "$RUNNER_TEMP/repflow-cache-bundle/CONTENTS.txt"

      - name: Upload dependency-only cache bundle
        uses: actions/upload-artifact@v4
        with:
          name: repflow-watch-public-dependency-cache
          path: ${{ runner.temp }}/repflow-cache-bundle/
          if-no-files-found: error
          retention-days: 7
