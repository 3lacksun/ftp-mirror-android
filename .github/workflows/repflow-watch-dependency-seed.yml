name: RepFlow Watch Dependency Seeder

on:
  push:
    branches:
      - repflow-watch-dependency-seed-20260916g
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout public scratch repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve exact Capacitor 8.5.0 npm closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repflow-npm-seed"
          cd "$RUNNER_TEMP/repflow-npm-seed"
          cat > package.json <<'JSON'
          {
            "name": "repflow-public-dependency-seed",
            "private": true,
            "dependencies": {
              "@capacitor/android": "8.5.0",
              "@capacitor/core": "8.5.0"
            },
            "devDependencies": {
              "@capacitor/cli": "8.5.0"
            }
          }
          JSON
          npm install --no-audit --no-fund
          npm ls --all > npm-tree.txt
          tar -czf "$RUNNER_TEMP/repflow-capacitor-node-modules.tgz" node_modules package.json package-lock.json npm-tree.txt
          sha256sum "$RUNNER_TEMP/repflow-capacitor-node-modules.tgz" | tee "$RUNNER_TEMP/repflow-capacitor-node-modules.tgz.sha256"

      - name: Resolve exact RepFlow Android Maven closure into portable local repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repflow-maven-seed"
          cd "$RUNNER_TEMP/repflow-maven-seed"
          cat > pom.xml <<'XML'
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>net.nexarenew.repflow</groupId>
            <artifactId>public-dependency-seed</artifactId>
            <version>1.0.0</version>
            <repositories>
              <repository><id>google</id><url>https://dl.google.com/dl/android/maven2/</url></repository>
              <repository><id>central</id><url>https://repo.maven.apache.org/maven2/</url></repository>
              <repository><id>gradle-plugins</id><url>https://plugins.gradle.org/m2/</url></repository>
            </repositories>
            <dependencies>
              <dependency><groupId>com.android.tools.build</groupId><artifactId>gradle</artifactId><version>8.13.0</version></dependency>
              <dependency><groupId>org.jetbrains.kotlin</groupId><artifactId>kotlin-gradle-plugin</artifactId><version>2.3.21</version></dependency>
              <dependency><groupId>org.jetbrains.kotlin.plugin.compose</groupId><artifactId>org.jetbrains.kotlin.plugin.compose.gradle.plugin</artifactId><version>2.3.21</version><type>pom</type></dependency>
              <dependency><groupId>com.google.gms</groupId><artifactId>google-services</artifactId><version>4.4.4</version></dependency>

              <dependency><groupId>com.google.android.gms</groupId><artifactId>play-services-wearable</artifactId><version>20.0.1</version><type>aar</type></dependency>
              <dependency><groupId>androidx.appcompat</groupId><artifactId>appcompat</artifactId><version>1.7.1</version><type>aar</type></dependency>
              <dependency><groupId>androidx.coordinatorlayout</groupId><artifactId>coordinatorlayout</artifactId><version>1.3.0</version><type>aar</type></dependency>
              <dependency><groupId>androidx.core</groupId><artifactId>core-splashscreen</artifactId><version>1.2.0</version><type>aar</type></dependency>
              <dependency><groupId>junit</groupId><artifactId>junit</artifactId><version>4.13.2</version></dependency>
              <dependency><groupId>androidx.test.ext</groupId><artifactId>junit</artifactId><version>1.3.0</version><type>aar</type></dependency>
              <dependency><groupId>androidx.test.espresso</groupId><artifactId>espresso-core</artifactId><version>3.7.0</version><type>aar</type></dependency>

              <dependency><groupId>androidx.activity</groupId><artifactId>activity</artifactId><version>1.11.0</version><type>aar</type></dependency>
              <dependency><groupId>androidx.core</groupId><artifactId>core</artifactId><version>1.17.0</version><type>aar</type></dependency>
              <dependency><groupId>androidx.fragment</groupId><artifactId>fragment</artifactId><version>1.8.9</version><type>aar</type></dependency>
              <dependency><groupId>androidx.webkit</groupId><artifactId>webkit</artifactId><version>1.14.0</version><type>aar</type></dependency>
              <dependency><groupId>org.apache.cordova</groupId><artifactId>framework</artifactId><version>14.0.1</version><type>aar</type></dependency>

              <dependency><groupId>androidx.activity</groupId><artifactId>activity-compose</artifactId><version>1.13.0</version><type>aar</type></dependency>
              <dependency><groupId>androidx.wear.compose</groupId><artifactId>compose-foundation</artifactId><version>1.6.2</version><type>aar</type></dependency>
              <dependency><groupId>androidx.wear.compose</groupId><artifactId>compose-material</artifactId><version>1.6.2</version><type>aar</type></dependency>
              <dependency><groupId>androidx.lifecycle</groupId><artifactId>lifecycle-runtime-ktx</artifactId><version>2.10.0</version><type>aar</type></dependency>
              <dependency><groupId>androidx.core</groupId><artifactId>core-ktx</artifactId><version>1.17.0</version><type>aar</type></dependency>
              <dependency><groupId>androidx.wear</groupId><artifactId>wear-ongoing</artifactId><version>1.1.0</version><type>aar</type></dependency>
              <dependency><groupId>androidx.health</groupId><artifactId>health-services-client</artifactId><version>1.1.0-rc02</version><type>aar</type></dependency>
              <dependency><groupId>androidx.room</groupId><artifactId>room-runtime</artifactId><version>2.8.5</version><type>aar</type></dependency>
              <dependency><groupId>androidx.room</groupId><artifactId>room-ktx</artifactId><version>2.8.5</version><type>aar</type></dependency>
              <dependency><groupId>androidx.room</groupId><artifactId>room-compiler</artifactId><version>2.8.5</version></dependency>
              <dependency><groupId>org.jetbrains.kotlinx</groupId><artifactId>kotlinx-coroutines-android</artifactId><version>1.10.2</version></dependency>
              <dependency><groupId>org.jetbrains.kotlinx</groupId><artifactId>kotlinx-coroutines-play-services</artifactId><version>1.10.2</version></dependency>
            </dependencies>
          </project>
          XML
          mvn -B -U -Dmaven.repo.local="$RUNNER_TEMP/repflow-m2" dependency:go-offline | tee "$RUNNER_TEMP/repflow-maven-resolution.txt"
          test -f "$RUNNER_TEMP/repflow-m2/com/google/android/gms/play-services-wearable/20.0.1/play-services-wearable-20.0.1.aar"
          test -f "$RUNNER_TEMP/repflow-m2/androidx/room/room-runtime/2.8.5/room-runtime-2.8.5.aar"
          test -f "$RUNNER_TEMP/repflow-m2/androidx/health/health-services-client/1.1.0-rc02/health-services-client-1.1.0-rc02.aar"
          test -f "$RUNNER_TEMP/repflow-m2/com/android/tools/build/gradle/8.13.0/gradle-8.13.0.jar"

      - name: Package portable dependency repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repflow-cache-bundle"
          cp "$RUNNER_TEMP/repflow-maven-resolution.txt" "$RUNNER_TEMP/repflow-cache-bundle/"
          cp "$RUNNER_TEMP/repflow-capacitor-node-modules.tgz" "$RUNNER_TEMP/repflow-cache-bundle/"
          cp "$RUNNER_TEMP/repflow-capacitor-node-modules.tgz.sha256" "$RUNNER_TEMP/repflow-cache-bundle/"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/repflow-cache-bundle/repflow-m2.tgz" repflow-m2
          sha256sum "$RUNNER_TEMP/repflow-cache-bundle/repflow-m2.tgz" | tee "$RUNNER_TEMP/repflow-cache-bundle/repflow-m2.tgz.sha256"
          find "$RUNNER_TEMP/repflow-cache-bundle" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort | tee "$RUNNER_TEMP/repflow-cache-bundle/CONTENTS.txt"

      - name: Upload dependency-only cache bundle
        uses: actions/upload-artifact@v4
        with:
          name: repflow-watch-public-dependency-cache
          path: ${{ runner.temp }}/repflow-cache-bundle/
          if-no-files-found: error
          retention-days: 7
