name: Resolve Lower Training Offline Dependencies
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/resolve-lower-training-deps.yml

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Prepare exact Gradle project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p project/app/src/main/java/com/lowertraining/app project/app/src/main/res/values
          cat > project/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LowerPremiumDependencyResolver"
          include(":app")
          EOF
          cat > project/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.11.1" apply false
              id("org.jetbrains.kotlin.android") version "2.2.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.2.21" apply false
          }
          EOF
          cat > project/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.lowertraining.app"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.lowertraining.app"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0.0"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              packaging { resources.excludes += "/META-INF/{AL2.0,LGPL2.1}" }
          }
          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2025.05.01")
              implementation(composeBom)
              androidTestImplementation(composeBom)
              implementation("androidx.core:core-ktx:1.16.0")
              implementation("androidx.activity:activity-compose:1.10.1")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.9.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF
          cat > project/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:theme="@style/AppTheme">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > project/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/></resources>
          EOF
          cat > project/app/src/main/java/com/lowertraining/app/MainActivity.kt <<'EOF'
          package com.lowertraining.app
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.material3.Text
          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { Text("Dependency resolver") }
              }
          }
          EOF

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Download and verify Gradle 8.13
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 3 -o gradle-8.13-bin.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          curl -fL --retry 5 --retry-delay 3 -o gradle-8.13-bin.zip.sha256 https://services.gradle.org/distributions/gradle-8.13-bin.zip.sha256
          echo "$(cat gradle-8.13-bin.zip.sha256)  gradle-8.13-bin.zip" | sha256sum -c -
          unzip -q gradle-8.13-bin.zip

      - name: Resolve and build
        shell: bash
        run: |
          set -euxo pipefail
          export GRADLE_USER_HOME="$PWD/gradle-user-home"
          ./gradle-8.13/bin/gradle -p project --no-daemon --stacktrace :app:dependencies
          ./gradle-8.13/bin/gradle -p project --no-daemon --stacktrace :app:assembleDebug

      - name: Verify offline rebuild
        shell: bash
        run: |
          set -euxo pipefail
          export GRADLE_USER_HOME="$PWD/gradle-user-home"
          rm -rf project/.gradle project/app/build project/build
          ./gradle-8.13/bin/gradle -p project --offline --no-daemon --stacktrace :app:assembleDebug

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p package
          cp gradle-8.13-bin.zip package/
          cp gradle-8.13-bin.zip.sha256 package/
          cp -a gradle-user-home package/gradle-user-home
          cat > package/README.txt <<'EOF'
          Exact offline Gradle dependency cache for Lower Training Android.
          Gradle 8.13; AGP 8.11.1; Kotlin 2.2.21; Compose plugin 2.2.21;
          Compose BOM 2025.05.01; core-ktx 1.16.0; activity-compose 1.10.1;
          lifecycle-viewmodel-compose 2.9.0; lifecycle-viewmodel-ktx 2.9.0.
          Captured only after a clean Gradle --offline assembleDebug succeeded.
          EOF
          find package -type f -print0 | sort -z | xargs -0 sha256sum > package/SHA256SUMS.txt
          tar -C package -czf LOWER_TRAINING_ANDROID_EXACT_OFFLINE_DEPS_24092026.tar.gz .
          sha256sum LOWER_TRAINING_ANDROID_EXACT_OFFLINE_DEPS_24092026.tar.gz > LOWER_TRAINING_ANDROID_EXACT_OFFLINE_DEPS_24092026.tar.gz.sha256

      - name: Upload dependency bundle
        uses: actions/upload-artifact@v4
        with:
          name: lower-training-exact-offline-deps-24092026
          path: |
            LOWER_TRAINING_ANDROID_EXACT_OFFLINE_DEPS_24092026.tar.gz
            LOWER_TRAINING_ANDROID_EXACT_OFFLINE_DEPS_24092026.tar.gz.sha256
          compression-level: 0
          retention-days: 7
